services:
  - type: web
    name: nomade-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    # Environment variables to configure on Render. Replace empty values in the Render
    # dashboard with your real secrets (do NOT commit sensitive values to git).
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        # e.g. https://www.nomadsnavigatenepal.com
        value: ""
        sync: false
      - key: DATABASE_URL
        # Neon/Postgres example (do NOT paste live credentials here if committing):
        # postgresql://<user>:<password>@<host>/<db>?sslmode=require
        value: ""
        sync: false
      - key: JWT_SECRET
        # e.g. a long random string generated with `openssl rand -hex 32`
        value: ""
        sync: false
      - key: COOKIE_SECRET
        value: ""
        sync: false
      - key: ADMIN_EMAIL
        # Initial admin account used by server seeding
        value: ""
        sync: false
      - key: ADMIN_PASSWORD
        # Strong temporary password; server will hash it on seed
        value: ""
        sync: false
      - key: ADMIN_EMAILS
        # Comma-separated list of admin emails. Supports creating multiple admin users.
        value: ""
        sync: false
      - key: ADMIN_PASSWORDS
        # Comma-separated list of passwords matching ADMIN_EMAILS order.
        value: ""
        sync: false
