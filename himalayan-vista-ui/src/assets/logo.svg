<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="64" viewBox="0 0 240 64" role="img" aria-label="Nomads Navigate Nepal logo">
  <title>Nomads Navigate Nepal</title>
  <defs>
